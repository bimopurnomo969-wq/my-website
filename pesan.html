<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu & Pesan - Kelas XI-6</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xs text-slate-400 hover:text-slate-200">&larr; Beranda</a>
            <h1 class="text-base font-bold text-emerald-400">✉️ Buku Tamu & Pesan</h1>
            <div id="admin-status" class="text-xs text-slate-400"></div>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-4xl mx-auto p-4 w-full flex-grow">
        
        <!-- Form Kirim Pesan (Terbuka untuk Siapa Saja / Siswa) -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 mb-6 shadow-lg">
            <h3 class="text-sm font-semibold text-emerald-400 mb-3">✍️ Tinggalkan Pesan / Kesan Kelas</h3>
            <form id="message-form" class="space-y-3">
                <div>
                    <input type="text" id="sender-name" placeholder="Nama / Nama Panggilan..." required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <textarea id="sender-message" placeholder="Tulis pesan, kesan, atau semangat untuk kelas kita..." rows="3" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 rounded-lg text-xs transition">Kirim Pesan</button>
            </form>
            <div id="form-msg" class="text-[11px] text-center mt-2 text-emerald-400"></div>
        </div>

        <!-- Daftar Pesan Masuk -->
        <div id="message-list" class="space-y-3">
            <p class="text-xs text-slate-500 text-center py-8">Memuat buku tamu...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center p-4 text-[11px] text-slate-500 border-t border-slate-800">
        &copy; 2026 - chronoxstar.my.id
    </footer>

    <!-- Logika JavaScript & Supabase -->
    <script type="module">
        import { supabase } from './assets/js/supabase.js';

        const adminStatus = document.getElementById('admin-status');
        const messageForm = document.getElementById('message-form');
        const messageList = document.getElementById('message-list');
        const formMsg = document.getElementById('form-msg');

        let isAdmin = false;

        // 1. Cek Sesi Admin
        async function checkAdmin() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                isAdmin = true;
                adminStatus.innerHTML = `<span class="bg-emerald-900/60 text-emerald-400 px-2 py-1 rounded border border-emerald-700 text-[10px]">Mode Admin</span>`;
            } else {
                adminStatus.innerHTML = `<a href="login.html" class="text-xs text-slate-400 hover:underline">Login</a>`;
            }
            loadMessages();
        }

        // 2. Ambil Daftar Pesan
        async function loadMessages() {
            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                messageList.innerHTML = `<p class="text-xs text-red-400 text-center">Gagal memuat pesan.</p>`;
                return;
            }

            if (data.length === 0) {
                messageList.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">Belum ada pesan di buku tamu.</p>`;
                return;
            }

            messageList.innerHTML = '';
            data.forEach(item => {
                const dateOptions = { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' };
                const formattedDate = new Date(item.created_at).toLocaleDateString('id-ID', dateOptions);

                // Tombol Hapus hanya muncul jika berstatus admin
                const deleteBtn = isAdmin ? `<button onclick="deleteMessage(${item.id})" class="text-[10px] bg-red-900/50 hover:bg-red-800 text-red-300 px-2 py-1 rounded border border-red-700 transition">Hapus</button>` : '';

                messageList.innerHTML += `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-sm flex justify-between items-start gap-3">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-semibold text-xs text-emerald-400">${item.sender_name}</span>
                                <span class="text-[10px] text-slate-500">&bull; ${formattedDate}</span>
                            </div>
                            <p class="text-xs sm:text-sm text-slate-200 whitespace-pre-wrap">${item.message}</p>
                        </div>
                        <div>${deleteBtn}</div>
                    </div>
                `;
            });
        }

        // 3. Kirim Pesan Baru (Publik)
        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const sender_name = document.getElementById('sender-name').value;
            const message = document.getElementById('sender-message').value;

            formMsg.textContent = "Mengirim pesan...";

            const { error } = await supabase
                .from('messages')
                .insert([{ sender_name, message }]);

            if (error) {
                formMsg.textContent = "Gagal: " + error.message;
            } else {
                formMsg.textContent = "Pesan berhasil dikirim!";
                messageForm.reset();
                loadMessages();
                setTimeout(() => formMsg.textContent = "", 3000);
            }
        });

        // 4. Hapus Pesan (Khusus Admin)
        window.deleteMessage = async function(id) {
            if (confirm("Yakin ingin menghapus pesan ini?")) {
                const { error } = await supabase
                    .from('messages')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert("Gagal menghapus: " + error.message);
                } else {
                    loadMessages();
                }
            }
        }

        checkAdmin();
    </script>

</body>
</html>
