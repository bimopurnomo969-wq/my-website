<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Kenangan - Kelas XI-6</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xs text-slate-400 hover:text-slate-200">&larr; Beranda</a>
            <h1 class="text-base font-bold text-emerald-400">📸 Galeri Kenangan</h1>
            <div id="admin-status" class="text-xs text-slate-400"></div>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-4xl mx-auto p-4 w-full flex-grow">
        
        <!-- Panel Upload Khusus Admin (Awalnya Disembunyikan) -->
        <div id="upload-panel" class="hidden bg-slate-800 border border-slate-700 rounded-2xl p-4 mb-6 shadow-lg">
            <h3 class="text-sm font-semibold text-emerald-400 mb-3">➕ Upload Foto Baru (Auto Compress)</h3>
            <form id="upload-form" class="space-y-3">
                <div>
                    <input type="file" id="foto-file" accept="image/*" required class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer">
                </div>
                <div>
                    <input type="text" id="foto-caption" placeholder="Keterangan foto (misal: Jamkos di kelas)..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <button type="submit" id="btn-upload" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 rounded-lg text-xs transition">Upload & Kompres Otomatis</button>
            </form>
            <div id="upload-status" class="text-[11px] text-center mt-2 text-emerald-400"></div>
        </div>

        <!-- Grid Galeri Foto -->
        <div id="gallery-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            <!-- Foto akan dimuat otomatis dari database di sini -->
            <p class="text-xs text-slate-500 col-span-full text-center py-8">Memuat foto kenangan...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center p-4 text-[11px] text-slate-500 border-t border-slate-800">
        &copy; 2026 - chronoxstar.my.id
    </footer>

    <!-- Logika JavaScript & Supabase -->
    <script type="module">
        import { supabase } from './assets/js/supabase.js';

        const uploadPanel = document.getElementById('upload-panel');
        const adminStatus = document.getElementById('admin-status');
        const uploadForm = document.getElementById('upload-form');
        const galleryGrid = document.getElementById('gallery-grid');
        const uploadStatus = document.getElementById('upload-status');

        // 1. Cek Apakah User Sedang Login sebagai Admin
        async function checkAdminSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                uploadPanel.classList.remove('hidden');
                adminStatus.innerHTML = `<span class="bg-emerald-900/60 text-emerald-400 px-2 py-1 rounded border border-emerald-700 text-[10px]">Mode Admin</span>`;
            } else {
                adminStatus.innerHTML = `<a href="login.html" class="text-xs text-slate-400 hover:underline">Login</a>`;
            }
        }

        // 2. Fungsi Kompresi Foto Otomatis sebelum di-upload
        function compressImage(file, maxWidth = 1000, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            const compressedFile = new File([blob], file.name, {
                                type: file.type,
                                lastModified: Date.now(),
                            });
                            resolve(compressedFile);
                        }, file.type, quality);
                    };
                };
                reader.onerror = (error) => reject(error);
            });
        }

        // 3. Ambil dan Tampilkan Foto dari Supabase
        async function loadPhotos() {
            const { data, error } = await supabase
                .from('photos')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                galleryGrid.innerHTML = `<p class="text-xs text-red-400 col-span-full text-center">Gagal memuat foto.</p>';
                return;
            }

            if (data.length === 0) {
                galleryGrid.innerHTML = `<p class="text-xs text-slate-500 col-span-full text-center py-8">Belum ada foto kenangan yang di-upload.</p>`;
                return;
            }

            galleryGrid.innerHTML = '';
            data.forEach(photo => {
                galleryGrid.innerHTML += `
                    <div class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700 shadow-md">
                        <img src="${photo.image_url}" alt="Foto Kenangan" class="w-full h-36 object-cover">
                        <div class="p-2.5">
                            <p class="text-[11px] text-slate-300 truncate">${photo.caption || 'Tanpa keterangan'}</p>
                        </div>
                    </div>
                `;
            });
        }

        // 4. Proses Upload Foto oleh Admin
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('foto-file');
            const captionInput = document.getElementById('foto-caption').value;
            const file = fileInput.files[0];

            if (!file) return;

            uploadStatus.textContent = "Mengkompres foto...";

            // Kompres foto otomatis
            const compressedFile = await compressImage(file, 1000, 0.7);
            uploadStatus.textContent = "Mengunggah ke database...";

            // Upload ke Supabase Storage (Pastikan Anda sudah membuat bucket publik bernama 'class-photos' di Supabase)
            const fileName = `foto_${Date.now()}.${file.name.split('.').pop()}`;
            const { data: storageData, error: storageError } = await supabase.storage
                .from('class-photos')
                .upload(fileName, compressedFile);

            if (storageError) {
                uploadStatus.textContent = "Gagal upload file: " + storageError.message;
                return;
            }

            // Dapatkan URL publik file yang di-upload
            const { data: publicURLData } = supabase.storage
                .from('class-photos')
                .getPublicUrl(fileName);

            const imageUrl = publicURLData.publicUrl;

            // Simpan link gambar ke tabel 'photos'
            const { error: dbError } = await supabase
                .from('photos')
                .insert([{ image_url: imageUrl, caption: captionInput }]);

            if (dbError) {
                uploadStatus.textContent = "Gagal simpan data: " + dbError.message;
            } else {
                uploadStatus.textContent = "Berhasil upload!";
                uploadForm.reset();
                loadPhotos();
                setTimeout(() => uploadStatus.textContent = "", 3000);
            }
        });

        // Jalankan saat halaman dibuka
        checkAdminSession();
        loadPhotos();
    </script>

</body>
</html>
