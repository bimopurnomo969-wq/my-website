<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Kelas - Kelas XI-6</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xs text-slate-400 hover:text-slate-200">&larr; Beranda</a>
            <h1 class="text-base font-bold text-emerald-400">💬 Status Kelas</h1>
            <div id="admin-status" class="text-xs text-slate-400"></div>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-4xl mx-auto p-4 w-full flex-grow">
        
        <!-- Panel Buat Status Khusus Admin -->
        <div id="status-panel" class="hidden bg-slate-800 border border-slate-700 rounded-2xl p-4 mb-6 shadow-lg">
            <h3 class="text-sm font-semibold text-emerald-400 mb-3">➕ Buat Status Baru</h3>
            <form id="status-form" class="space-y-3">
                <div>
                    <textarea id="status-content" placeholder="Tulis pengumuman atau status kelas hari ini..." rows="3" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 rounded-lg text-xs transition">Kirim Status</button>
            </form>
            <div id="form-msg" class="text-[11px] text-center mt-2 text-emerald-400"></div>
        </div>

        <!-- Daftar Status -->
        <div id="status-list" class="space-y-3">
            <p class="text-xs text-slate-500 text-center py-8">Memuat status kelas...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center p-4 text-[11px] text-slate-500 border-t border-slate-800">
        &copy; 2026 - chronoxstar.my.id
    </footer>

    <!-- Logika JavaScript & Supabase -->
    <script type="module">
        import { supabase } from './assets/js/supabase.js';

        const statusPanel = document.getElementById('status-panel');
        const adminStatus = document.getElementById('admin-status');
        const statusForm = document.getElementById('status-form');
        const statusList = document.getElementById('status-list');
        const formMsg = document.getElementById('form-msg');

        // 1. Cek Sesi Admin
        async function checkAdmin() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                statusPanel.classList.remove('hidden');
                adminStatus.innerHTML = `<span class="bg-emerald-900/60 text-emerald-400 px-2 py-1 rounded border border-emerald-700 text-[10px]">Mode Admin</span>`;
            } else {
                adminStatus.innerHTML = `<a href="login.html" class="text-xs text-slate-400 hover:underline">Login</a>`;
            }
        }

        // 2. Ambil Daftar Status
        async function loadStatuses() {
            const { data, error } = await supabase
                .from('statuses')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                statusList.innerHTML = `<p class="text-xs text-red-400 text-center">Gagal memuat status.</p>`;
                return;
            }

            if (data.length === 0) {
                statusList.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">Belum ada status atau pengumuman saat ini.</p>`;
                return;
            }

            statusList.innerHTML = '';
            data.forEach(item => {
                const dateOptions = { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' };
                const formattedDate = new Date(item.created_at).toLocaleDateString('id-ID', dateOptions);

                statusList.innerHTML += `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-sm">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded">👑 ${item.author}</span>
                            <span class="text-[10px] text-slate-500">${formattedDate}</span>
                        </div>
                        <p class="text-xs sm:text-sm text-slate-200 whitespace-pre-wrap">${item.content}</p>
                    </div>
                `;
            });
        }

        // 3. Kirim Status Baru (Admin)
        statusForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('status-content').value;

            formMsg.textContent = "Mengirim status...";

            const { error } = await supabase
                .from('statuses')
                .insert([{ content: content, author: 'Admin Kelas' }]);

            if (error) {
                formMsg.textContent = "Gagal: " + error.message;
            } else {
                formMsg.textContent = "Status berhasil dipublikasikan!";
                statusForm.reset();
                loadStatuses();
                setTimeout(() => formMsg.textContent = "", 3000);
            }
        });

        checkAdmin();
        loadStatuses();
    </script>

</body>
</html>
