<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal & Tugas - Kelas XI-6</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xs text-slate-400 hover:text-slate-200">&larr; Beranda</a>
            <h1 class="text-base font-bold text-emerald-400">📚 Jadwal & Tugas</h1>
            <div id="admin-status" class="text-xs text-slate-400"></div>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-4xl mx-auto p-4 w-full flex-grow">
        
        <!-- Panel Tambah Tugas Khusus Admin -->
        <div id="task-panel" class="hidden bg-slate-800 border border-slate-700 rounded-2xl p-4 mb-6 shadow-lg">
            <h3 class="text-sm font-semibold text-emerald-400 mb-3">➕ Tambah Tugas Baru</h3>
            <form id="task-form" class="space-y-3">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input type="text" id="task-title" placeholder="Judul Tugas (misal: PR Bab 3)" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                    <input type="text" id="task-subject" placeholder="Mata Pelajaran (misal: Matematika)" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Batas Pengumpulan (Deadline):</label>
                    <input type="date" id="task-deadline" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <textarea id="task-desc" placeholder="Detail atau instruksi tugas..." rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 rounded-lg text-xs transition">Simpan Tugas</button>
            </form>
            <div id="task-status" class="text-[11px] text-center mt-2 text-emerald-400"></div>
        </div>

        <!-- Daftar Tugas -->
        <div id="task-list" class="space-y-3">
            <p class="text-xs text-slate-500 text-center py-8">Memuat daftar tugas...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center p-4 text-[11px] text-slate-500 border-t border-slate-800">
        &copy; 2026 - chronoxstar.my.id
    </footer>

    <!-- Logika JavaScript & Supabase -->
    <script type="module">
        import { supabase } from './assets/js/supabase.js';

        const taskPanel = document.getElementById('task-panel');
        const adminStatus = document.getElementById('admin-status');
        const taskForm = document.getElementById('task-form');
        const taskList = document.getElementById('task-list');
        const taskStatus = document.getElementById('task-status');

        // 1. Cek Sesi Admin
        async function checkAdmin() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                taskPanel.classList.remove('hidden');
                adminStatus.innerHTML = `<span class="bg-emerald-900/60 text-emerald-400 px-2 py-1 rounded border border-emerald-700 text-[10px]">Mode Admin</span>`;
            } else {
                adminStatus.innerHTML = `<a href="login.html" class="text-xs text-slate-400 hover:underline">Login</a>`;
            }
        }

        // 2. Ambil Daftar Tugas dari Supabase
        async function loadTasks() {
            const { data, error } = await supabase
                .from('tasks')
                .select('*')
                .order('deadline', { ascending: true });

            if (error) {
                taskList.innerHTML = `<p class="text-xs text-red-400 text-center">Gagal memuat tugas.</p>`;
                return;
            }

            if (data.length === 0) {
                taskList.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">Hore! Belum ada tugas atau PR saat ini.</p>`;
                return;
            }

            taskList.innerHTML = '';
            data.forEach(task => {
                taskList.innerHTML += `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                            <span class="text-[10px] bg-emerald-900/50 text-emerald-400 px-2 py-0.5 rounded border border-emerald-700/50">${task.subject}</span>
                            <h4 class="font-bold text-sm mt-1 text-slate-100">${task.title}</h4>
                            <p class="text-xs text-slate-400 mt-1">${task.description || 'Tidak ada deskripsi tambahan.'}</p>
                        </div>
                        <div class="text-right w-full sm:w-auto border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-700">
                            <span class="text-[11px] text-amber-400 font-semibold block">Deadline: ${task.deadline}</span>
                        </div>
                    </div>
                `;
            });
        }

        // 3. Tambah Tugas Baru (Admin)
        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('task-title').value;
            const subject = document.getElementById('task-subject').value;
            const deadline = document.getElementById('task-deadline').value;
            const description = document.getElementById('task-desc').value;

            taskStatus.textContent = "Menyimpan tugas...";

            const { error } = await supabase
                .from('tasks')
                .insert([{ title, subject, deadline, description }]);

            if (error) {
                taskStatus.textContent = "Gagal: " + error.message;
            } else {
                taskStatus.textContent = "Tugas berhasil ditambahkan!";
                taskForm.reset();
                loadTasks();
                setTimeout(() => taskStatus.textContent = "", 3000);
            }
        });

        checkAdmin();
        loadTasks();
    </script>

</body>
</html>
